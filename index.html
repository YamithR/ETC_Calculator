<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ETC Calculator</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a3a5c">
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f0e8;
    color: #2c2c2c;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    line-height: 1.5;
  }
  .container {
    width: 100%;
    max-width: 1100px;
  }
  .header-wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header {
    background: #1a3a5c;
    color: #fff;
    padding: 1.25rem 2rem;
    border-radius: 8px;
    margin-bottom: 1.5rem;
    text-align: center;
  }
  header h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  header p {
    font-size: 0.875rem;
    opacity: 0.8;
    margin-top: 0.25rem;
  }
  .info-btn {
    cursor: pointer;
    font-size: 1.2rem;
    opacity: 0.7;
    padding: 0 6px;
    -webkit-app-region: no-drag;
  }
  .info-btn:hover {
    opacity: 1;
  }
  .modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-content {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    width: 320px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 0;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #eee;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .modal-close {
    cursor: pointer;
    font-size: 1.2rem;
    color: #999;
    line-height: 1;
  }
  .modal-close:hover {
    color: #d32f2f;
  }
  .modal-body {
    padding: 14px 16px;
    font-size: 0.85rem;
    line-height: 1.6;
  }
  .setting-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #f0ede8;
  }
  .setting-row label {
    flex: 1;
    font-size: 0.85rem;
    color: #444;
  }
  .shortcut-input {
    padding: 4px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.85rem;
    font-family: monospace;
    width: 120px;
    text-align: center;
    outline: none;
    cursor: pointer;
    background: #f9f9f9;
  }
  .shortcut-input:focus {
    border-color: #1a3a5c;
  }
  .modal-btn {
    padding: 4px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f5f5f5;
    cursor: pointer;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .modal-btn:hover {
    background: #e8e8e8;
  }
  .ab-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 2px; }
  .ab-version { color: #999; margin-bottom: 6px; }
  .ab-section { color: #1a3a5c; margin-top: 8px; margin-bottom: 2px; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .ab-link { color: #1a3a5c; text-decoration: none; }
  .ab-link:hover { text-decoration: underline; }
  .hidden { display: none !important; }
  .layout {
    display: flex;
    gap: 1.5rem;
    align-items: flex-start;
  }
  .layout-left {
    flex: 0 0 340px;
    min-width: 280px;
  }
  .layout-right {
    flex: 1;
    min-width: 0;
  }
  .card {
    background: #fff;
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .card-title {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #1a3a5c;
    margin-bottom: 1rem;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid #1a3a5c;
  }
  .form-row {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    margin-bottom: 0.85rem;
  }
  .form-row label {
    font-size: 0.8rem;
    font-weight: 500;
    color: #444;
  }
  .form-row input {
    padding: 0.5rem 0.65rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-row input:focus {
    border-color: #1a3a5c;
    box-shadow: 0 0 0 2px rgba(26,58,92,0.15);
  }
  .hint {
    font-size: 0.7rem;
    color: #999;
  }
  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.3rem 1.25rem;
  }
  .result-item {
    display: flex;
    justify-content: space-between;
    padding: 0.3rem 0;
    font-size: 0.825rem;
    border-bottom: 1px solid #f0ede8;
  }
  .result-item .label {
    color: #666;
  }
  .result-item .value {
    font-weight: 600;
    color: #1a3a5c;
  }
  .result-item.full {
    grid-column: 1 / -1;
  }
  .result-item.highlight {
    background: #eef3f9;
    padding: 0.45rem 0.75rem;
    border-radius: 4px;
    border-bottom: none;
  }
  .result-item.highlight .value {
    color: #1a3a5c;
    font-size: 0.925rem;
  }
  .error-msg {
    background: #fdecea;
    border-left: 4px solid #d32f2f;
    padding: 0.65rem 1rem;
    border-radius: 4px;
    font-size: 0.8rem;
    color: #a00;
    margin-bottom: 0.75rem;
    display: none;
  }
  .warning {
    background: #fff3e0;
    border-left: 4px solid #f57c00;
    padding: 0.65rem 1rem;
    border-radius: 4px;
    font-size: 0.8rem;
    color: #8d5a00;
    margin-bottom: 0.75rem;
    display: none;
  }
  footer {
    text-align: center;
    font-size: 0.75rem;
    color: #999;
    padding: 1rem 0;
    margin-top: 0.5rem;
  }
  .results-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    color: #bbb;
    font-size: 0.9rem;
    text-align: center;
  }
  .dark-theme body,
  body.dark-theme {
    background: #1a1a2e;
    color: #e0e0e0;
  }
  .dark-theme .card { background: #16213e; color: #e0e0e0; }
  .dark-theme .card-title { color: #a8d8ea; }
  .dark-theme .form-row label { color: #bbb; }
  .dark-theme .form-row input { background: #0f3460; border: 1px solid #1a5276; color: #e0e0e0; }
  .dark-theme .result-item .label { color: #aaa; }
  .dark-theme .result-item .value { color: #a8d8ea; }
  .dark-theme .modal-content { background: #16213e; color: #e0e0e0; }
  .dark-theme .modal-header { border-bottom: 1px solid #1a5276; }
  .dark-theme .setting-row { border-bottom: 1px solid #1a5276; }
  .dark-theme .setting-row label { color: #bbb; }
  .dark-theme .shortcut-input { background: #0f3460; border: 1px solid #1a5276; color: #e0e0e0; }
  .dark-theme .modal-btn { background: #0f3460; border: 1px solid #1a5276; color: #ccc; }
  .dark-theme .error-msg { background: #2d1b1b; }
  .dark-theme .warning { background: #2d2510; }
  .dark-theme .hint { color: #777; }
  .dark-theme footer { color: #777; }
  .dark-theme .modal-close { color: #888; }
  @media (max-width: 800px) {
    body { padding: 1rem 0.75rem; }
    .layout { flex-direction: column; }
    .layout-left { flex: none; width: 100%; min-width: 0; }
    .card { padding: 1rem 1.15rem; }
    header { padding: 1rem 1.25rem; }
    header h1 { font-size: 1.25rem; }
    .result-grid { grid-template-columns: 1fr; }
    .form-row input { min-height: 44px; font-size: 16px; }
    .form-row label { font-size: 0.9rem; }
    .btn { min-height: 48px; font-size: 1.1rem; }
    .result-item { font-size: 0.9rem; padding: 0.5rem 0; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-wrap">
      <div>
        <h1>ETC Calculator</h1>
        <p>Estimated Cargo Completion Time</p>
      </div>
      <div class="info-btn" id="infoBtn" title="Acerca de / Configuración">ⓘ</div>
    </div>
  </header>

  <div class="layout">
    <div class="layout-left">
      <div class="card">
        <div class="card-title">Input Parameters</div>
        <div class="form-row">
          <label for="totalCargo">Total Cargo (MT)</label>
          <input type="text" id="totalCargo" placeholder="e.g. 50000 or 40000+10000">
          <span class="hint">Math expressions: + - * / ( )</span>
        </div>
        <div class="form-row">
          <label for="loadedCargo">Loaded Cargo (MT)</label>
          <input type="text" id="loadedCargo" placeholder="e.g. 20000">
        </div>
        <div class="form-row">
          <label for="trimmingCargo">Trimming Cargo (MT)</label>
          <input type="text" id="trimmingCargo" placeholder="e.g. 5000">
        </div>
        <div class="form-row">
          <label for="loadingRate">Loading Rate (MT/h)</label>
          <input type="text" id="loadingRate" placeholder="e.g. 1500">
        </div>
        <div class="form-row">
          <label for="stepsRemaining">Steps Remaining</label>
          <input type="text" id="stepsRemaining" placeholder="e.g. 3">
        </div>
      </div>
    </div>

    <div class="layout-right">
      <div id="errorContainer" class="error-msg"></div>
      <div id="warningContainer" class="warning"></div>

      <div id="resultsContainer">
        <div class="results-placeholder" id="placeholder">
          Enter values to see results
        </div>
      </div>

      <div id="resultsCards" style="display:none;">
        <div class="card">
          <div class="card-title">Input Summary</div>
          <div class="result-grid" id="inputSummary"></div>
        </div>
        <div class="card">
          <div class="card-title">Final ETC Calculation</div>
          <div class="result-grid" id="etcCalculation"></div>
        </div>
        <div class="card">
          <div class="card-title">Intermediate Calculation</div>
          <div class="result-grid" id="intermediateCalc"></div>
        </div>
        <div class="card">
          <div class="card-title">Estimated Times</div>
          <div class="result-grid" id="estimatedTimes"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span>Configuración</span>
        <span class="modal-close" id="settingsClose">&times;</span>
      </div>
      <div class="modal-body">
        <div class="setting-row">
          <label>Atajo de teclado (global)</label>
          <input type="text" id="shortcutInput" class="shortcut-input" readonly
                 placeholder="Presiona..."
                 value="Ctrl+Shift+E">
          <button id="shortcutBtn" class="modal-btn">Cambiar</button>
        </div>
        <div class="setting-row">
          <label>Tema oscuro</label>
          <input type="checkbox" id="themeToggle">
        </div>
      </div>
    </div>
  </div>

  <div id="aboutModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span>Acerca de</span>
        <span class="modal-close" id="aboutClose">&times;</span>
      </div>
      <div class="modal-body" id="aboutContent"></div>
    </div>
  </div>

  <footer>ETC Calculator v1.0.0</footer>
</div>

<script>
  let listeningForShortcut = false;
  let appConfig = {};

  window.electronAPI.getConfig().then(c => { appConfig = c; applyConfigUI(); });
  let aboutShortcutHandler = null;

  function applyConfigUI() {
    document.getElementById('shortcutInput').value = appConfig['shortcut-key'] || 'Ctrl+Shift+E';
    document.getElementById('themeToggle').checked = appConfig.theme === 'dark';
    if (appConfig.theme === 'dark') applyDarkTheme();
  }

  function applyDarkTheme() {
    document.body.classList.add('dark-theme');
  }

  function applyLightTheme() {
    document.body.classList.remove('dark-theme');
  }

  function startShortcutListen() {
    listeningForShortcut = true;
    document.getElementById('shortcutInput').value = 'Presiona...';
    document.getElementById('shortcutInput').focus();
  }

  document.addEventListener('keydown', function(e) {
    if (listeningForShortcut) {
      e.preventDefault();
      var parts = [];
      if (e.ctrlKey) parts.push('Ctrl');
      if (e.altKey) parts.push('Alt');
      if (e.shiftKey) parts.push('Shift');
      var key = e.key;
      if (!['Control', 'Alt', 'Shift', 'Meta'].includes(key)) {
        parts.push(key.length === 1 ? key.toUpperCase() : key);
        var shortcut = parts.join('+');
        document.getElementById('shortcutInput').value = shortcut;
        listeningForShortcut = false;
        appConfig['shortcut-key'] = shortcut;
        window.electronAPI.setConfig({ 'shortcut-key': shortcut });
      }
    }
  });

  document.getElementById('infoBtn').addEventListener('click', function() {
    window.electronAPI.getAppInfo().then(function(info) {
      document.getElementById('aboutContent').innerHTML =
        '<div class="ab-title">' + info.name + '</div>' +
        '<div class="ab-version">v' + info.version + '</div>' +
        '<div>' + info.description + '</div>' +
        '<div class="ab-section">Desarrollador</div>' +
        '<div>' + info.author + '</div>' +
        '<div><a href="mailto:' + info.email + '" class="ab-link">' + info.email + '</a></div>' +
        '<div class="ab-section">GitHub</div>' +
        '<div><a href="' + info.github + '" class="ab-link" target="_blank">' + info.github + '</a></div>' +
        '<div class="ab-section">Repositorio</div>' +
        '<div><a href="' + info.repo + '" class="ab-link" target="_blank">' + info.repo + '</a></div>' +
        '<div class="ab-section">Atajo de teclado global</div>' +
        '<div><button id="aboutShortcutBtn" class="modal-btn">Configurar atajo</button></div>';
      document.getElementById('aboutModal').classList.remove('hidden');
      if (aboutShortcutHandler) {
        document.getElementById('aboutShortcutBtn').removeEventListener('click', aboutShortcutHandler);
      }
      aboutShortcutHandler = function() {
        document.getElementById('aboutModal').classList.add('hidden');
        document.getElementById('settingsModal').classList.remove('hidden');
      };
      document.getElementById('aboutShortcutBtn').addEventListener('click', aboutShortcutHandler);
    });
  });

  document.getElementById('aboutClose').addEventListener('click', function() {
    document.getElementById('aboutModal').classList.add('hidden');
  });

  document.getElementById('aboutModal').addEventListener('click', function(e) {
    if (e.target === document.getElementById('aboutModal')) {
      document.getElementById('aboutModal').classList.add('hidden');
    }
  });

  document.getElementById('settingsClose').addEventListener('click', function() {
    document.getElementById('settingsModal').classList.add('hidden');
  });

  document.getElementById('settingsModal').addEventListener('click', function(e) {
    if (e.target === document.getElementById('settingsModal')) {
      document.getElementById('settingsModal').classList.add('hidden');
    }
  });

  document.getElementById('shortcutBtn').addEventListener('click', startShortcutListen);
  document.getElementById('shortcutInput').addEventListener('click', startShortcutListen);

  document.getElementById('themeToggle').addEventListener('change', function() {
    var theme = this.checked ? 'dark' : 'light';
    appConfig.theme = theme;
    window.electronAPI.setConfig({ theme: theme });
    if (theme === 'dark') {
      applyDarkTheme();
    } else {
      applyLightTheme();
    }
  });

  function evaluateExpression(input) {
    const s = input.replace(/,/g, '.').replace(/\s/g, '');
    if (!s) return null;
    if (!/^[\d+\-*/().]+$/.test(s)) return null;
    try {
      const result = Function('"use strict"; return (' + s + ')')();
      if (typeof result !== 'number' || !isFinite(result)) return null;
      return result;
    } catch {
      return null;
    }
  }

  function fmt(num) {
    return num.toFixed(2);
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ' / ' + String(d.getDate()).padStart(2, '0') + '-' + months[d.getMonth()] + '-' + d.getFullYear();
  }

  function createResultItem(label, value, extraClass) {
    const div = document.createElement('div');
    div.className = 'result-item' + (extraClass ? ' ' + extraClass : '');
    div.innerHTML = '<span class="label">' + label + '</span><span class="value">' + value + '</span>';
    return div;
  }

  function render(parentId, items) {
    const parent = document.getElementById(parentId);
    parent.innerHTML = '';
    items.forEach(function(item) {
      parent.appendChild(createResultItem(item.label, item.value, item.extraClass));
    });
  }

  function calculate() {
    const errorContainer = document.getElementById('errorContainer');
    const warningContainer = document.getElementById('warningContainer');
    const placeholder = document.getElementById('placeholder');
    const resultsCards = document.getElementById('resultsCards');

    errorContainer.style.display = 'none';
    warningContainer.style.display = 'none';

    const totalCargo = evaluateExpression(document.getElementById('totalCargo').value);
    const loadedCargo = evaluateExpression(document.getElementById('loadedCargo').value);
    const trimmingCargo = evaluateExpression(document.getElementById('trimmingCargo').value);
    const loadingRate = evaluateExpression(document.getElementById('loadingRate').value);
    const stepsRemainingRaw = evaluateExpression(document.getElementById('stepsRemaining').value);

    if (totalCargo === null || loadedCargo === null || trimmingCargo === null || loadingRate === null || stepsRemainingRaw === null) {
      placeholder.style.display = 'flex';
      resultsCards.style.display = 'none';
      return;
    }

    if (loadingRate <= 0) {
      errorContainer.textContent = 'Error: Loading Rate must be greater than zero.';
      errorContainer.style.display = 'block';
      placeholder.style.display = 'flex';
      resultsCards.style.display = 'none';
      return;
    }

    if (loadedCargo > totalCargo) {
      errorContainer.textContent = 'Error: Loaded Cargo cannot be greater than Total Cargo.';
      errorContainer.style.display = 'block';
      placeholder.style.display = 'flex';
      resultsCards.style.display = 'none';
      return;
    }

    if (trimmingCargo < 0) {
      errorContainer.textContent = 'Error: Trimming Cargo cannot be negative.';
      errorContainer.style.display = 'block';
      placeholder.style.display = 'flex';
      resultsCards.style.display = 'none';
      return;
    }

    if (trimmingCargo > totalCargo) {
      errorContainer.textContent = 'Error: Trimming Cargo cannot be greater than Total Cargo.';
      errorContainer.style.display = 'block';
      placeholder.style.display = 'flex';
      resultsCards.style.display = 'none';
      return;
    }

    const stepsRemaining = Math.round(stepsRemainingRaw);
    if (stepsRemaining < 1 || Math.abs(stepsRemainingRaw - stepsRemaining) > 0.0001) {
      errorContainer.textContent = 'Error: Steps Remaining must be an integer greater than or equal to 1.';
      errorContainer.style.display = 'block';
      placeholder.style.display = 'flex';
      resultsCards.style.display = 'none';
      return;
    }

    const cargoBeforeIntermediate = totalCargo - trimmingCargo;

    if (cargoBeforeIntermediate < loadedCargo) {
      warningContainer.innerHTML = '<strong>Warning:</strong> The Intermediate point has already been passed.<br>Cargo before Intermediate: ' + fmt(cargoBeforeIntermediate) + ' MT &nbsp;|&nbsp; Current Loaded: ' + fmt(loadedCargo) + ' MT';
      warningContainer.style.display = 'block';
      placeholder.style.display = 'flex';
      resultsCards.style.display = 'none';
      return;
    }

    const loadingTime = (totalCargo - loadedCargo) / loadingRate;
    const deadTime = ((stepsRemaining * 10) / 60) + 1;
    const totalCompletionTime = loadingTime + deadTime;

    const loadingTimeBeforeIntermediate = (cargoBeforeIntermediate - loadedCargo) / loadingRate;
    const intermediateWaitingTime = ((stepsRemaining - 1) * 10) / 60;
    const timeToIntermediate = loadingTimeBeforeIntermediate + intermediateWaitingTime;

    const now = Date.now();
    const completionMs = totalCompletionTime * 3600 * 1000;
    const intermediateMs = timeToIntermediate * 3600 * 1000;

    const etcTimestamp = now + completionMs;
    const intermediateTimestamp = now + intermediateMs;
    const unberthingTimestamp = intermediateTimestamp + (4 * 3600 * 1000);
    const underwaterInspectionTimestamp = intermediateTimestamp + (6 * 3600 * 1000);

    const currentDatetime = formatDate(now);
    const intermediateDatetime = formatDate(intermediateTimestamp);
    const unberthingDatetime = formatDate(unberthingTimestamp);
    const underwaterInspectionDatetime = formatDate(underwaterInspectionTimestamp);
    const etcDatetime = formatDate(etcTimestamp);

    render('inputSummary', [
      { label: 'Total Cargo', value: fmt(totalCargo) + ' MT' },
      { label: 'Loaded Cargo', value: fmt(loadedCargo) + ' MT' },
      { label: 'Trimming Cargo', value: fmt(trimmingCargo) + ' MT' },
      { label: 'Cargo before Intermediate', value: fmt(cargoBeforeIntermediate) + ' MT' },
      { label: 'Loading Rate', value: fmt(loadingRate) + ' MT/h' },
      { label: 'Steps Remaining', value: String(stepsRemaining) }
    ]);

    render('etcCalculation', [
      { label: 'Loading Time', value: fmt(loadingTime) + ' hours' },
      { label: 'Dead Time', value: fmt(deadTime) + ' hours' },
      { label: 'Total Completion Time', value: fmt(totalCompletionTime) + ' hours', extraClass: 'highlight' }
    ]);

    render('intermediateCalc', [
      { label: 'Loading Time before Intermediate', value: fmt(loadingTimeBeforeIntermediate) + ' hours' },
      { label: 'Intermediate Waiting Time', value: fmt(intermediateWaitingTime) + ' hours' },
      { label: 'Total Time to Intermediate', value: fmt(timeToIntermediate) + ' hours', extraClass: 'highlight' }
    ]);

    render('estimatedTimes', [
      { label: 'Current Time', value: currentDatetime },
      { label: 'Estimated Intermediate Time', value: intermediateDatetime },
      { label: 'Estimated Unberthing Time', value: unberthingDatetime },
      { label: 'Underwater Inspection Time', value: underwaterInspectionDatetime },
      { label: 'ETC - Estimated Completion', value: etcDatetime, extraClass: 'highlight' }
    ]);

    placeholder.style.display = 'none';
    resultsCards.style.display = 'block';
  }

  document.addEventListener('DOMContentLoaded', function() {
    var inputs = document.querySelectorAll('.form-row input');
    for (var i = 0; i < inputs.length; i++) {
      inputs[i].addEventListener('input', calculate);
    }
  });
